name: Deep test suite

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 9 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: ''
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Verify repository contract
        run: python scripts/verify_repository.py
      - name: Run deterministic deep suite
        env:
          PYTHONPATH: src
          DEEP_TEST_SEEDS: '0-49'
        run: python -m unittest discover -s tests -v
      - name: Check out canonical desktop interface
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: file-tunnel/ftnl-interfaces
          ref: 9ffa2741d24a94ff4752a035086a207a7d9015ca
          path: .external/ftnl-interfaces
          persist-credentials: false
      - name: Check out Rust desktop implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: file-tunnel/ftnl-desktop-app.rs
          ref: 7f3abb7c5319418305629d857665c443ae1fdaa5
          path: .external/ftnl-desktop-app-rs
          persist-credentials: false
      - name: Verify paired desktop contract at immutable revisions
        env:
          PYTHONPATH: src
        run: |
          python -m deep_tests.desktop_contract \
            --interfaces .external/ftnl-interfaces \
            --rust .external/ftnl-desktop-app-rs \
            --flutter-evidence fixtures/flutter-desktop-evidence.json \
            --source-lock fixtures/desktop-contract-sources.json \
            --verify-git-revisions
