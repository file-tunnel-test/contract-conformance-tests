name: Deep test suite

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 9 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: ''
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Verify repository contract
        run: python scripts/verify_repository.py
      - name: Run deterministic deep suite
        env:
          PYTHONPATH: src
          DEEP_TEST_SEEDS: '0-49'
        run: python -m unittest discover -s tests -v
      - name: Check out canonical worker interface
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: file-tunnel/ftnl-interfaces
          ref: 574fa514a0c19064cb816ffc64037c714e38f0b4
          path: .external/ftnl-worker-interfaces
          persist-credentials: false
      - name: Install pinned Protobuf compiler
        env:
          PROTOC_SHA256: c4bc672d9d49214dc8cafdceadf4df92182d6ca8e3ec65a56b2d7de5602669b4
          PROTOC_VERSION: "36.1"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/protoc.zip"
          install_dir="$RUNNER_TEMP/protoc"
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --connect-timeout 10 --max-time 120 \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip" \
            --output "$archive"
          sha256sum --check <<< "$PROTOC_SHA256  $archive"
          unzip -q "$archive" -d "$install_dir"
          echo "$install_dir/bin" >> "$GITHUB_PATH"
      - name: Verify worker authority and runtime parity
        env:
          PYTHONPATH: src
        run: |
          python -m deep_tests.worker_contract \
            --interfaces .external/ftnl-worker-interfaces \
            --source-lock fixtures/worker-contract-source.json \
            --verify-git-revision \
            --require-protoc
      - name: Check out canonical desktop interface
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: file-tunnel/ftnl-interfaces
          ref: 9ffa2741d24a94ff4752a035086a207a7d9015ca
          path: .external/ftnl-interfaces
          persist-credentials: false
      - name: Check out Rust desktop implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: file-tunnel/ftnl-desktop-app.rs
          ref: fb6dc13a848b2a33d638a6ea3c83ac68ba06d96e
          path: .external/ftnl-desktop-app-rs
          persist-credentials: false
      - name: Verify paired desktop contract at immutable revisions
        env:
          PYTHONPATH: src
        run: |
          python -m deep_tests.desktop_contract \
            --interfaces .external/ftnl-interfaces \
            --rust .external/ftnl-desktop-app-rs \
            --flutter-evidence fixtures/flutter-desktop-evidence.json \
            --source-lock fixtures/desktop-contract-sources.json \
            --verify-git-revisions
